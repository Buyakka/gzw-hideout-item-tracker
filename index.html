<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0c0c" />
    <meta name="description" content="Track every item you need to build and upgrade your Gray Zone Warfare hideout. Saves your progress in your browser." />
    <title>Buyaka // GZW Hideout Item Tracker</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap"
    />
  </head>
  <body>
    <!-- 3D background -->
    <div class="bg-fx" aria-hidden="true">
      <div class="bg-fx__floor"><div class="bg-fx__plane"></div></div>
      <div class="bg-fx__dust"></div>
      <div class="bg-fx__sweep"></div>
      <div class="bg-fx__scan"></div>
      <div class="bg-fx__vignette"></div>
    </div>

    <div class="app">
      <header class="hud">
        <a class="hud__brand" href="#utility" aria-label="Buyaka hideout tracker home">
          <div class="cube" aria-hidden="true">
            <div class="cube__inner">
              <span class="cube__face"></span><span class="cube__face"></span><span class="cube__face"></span>
              <span class="cube__face"></span><span class="cube__face"></span><span class="cube__face"></span>
            </div>
          </div>
          <div>
            <p class="hud__title">Buyaka <span>//</span> Hideout</p>
            <p class="hud__sub">Gray Zone Warfare · Update 0.5</p>
          </div>
        </a>

        <div class="hud__stats" data-stats aria-live="polite"></div>

        <div class="hud__radar" aria-hidden="true">
          <div class="radar">
            <span class="radar__blip" style="top: 22%; left: 64%; --d: 0.3s"></span>
            <span class="radar__blip" style="top: 62%; left: 30%; --d: 1.9s"></span>
            <span class="radar__blip" style="top: 70%; left: 72%; --d: 1.1s"></span>
          </div>
        </div>

        <div class="hud__actions">
          <button class="btn btn--sm" data-action="export" title="Save a backup file of your progress">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg>
            <span class="btn__text--md">Backup</span>
          </button>
          <button class="btn btn--sm" data-action="import" title="Load a backup file">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21V9M7 14l5-5 5 5M4 3h16"/></svg>
            <span class="btn__text--md">Load</span>
          </button>
          <button class="btn btn--sm btn--danger" data-action="reset" title="Erase all progress">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
            <span class="btn__text--md">Reset</span>
          </button>
          <input type="file" id="import-file" accept="application/json,.json" hidden />
        </div>
      </header>

      <nav class="room-tabs" role="tablist" aria-label="Hideout rooms"></nav>

      <main class="main" id="view"></main>

      <footer class="footer">
        Fan made tool. Not made by or linked to MADFINGER Games. Station data checked Oct 27, 2026.
        Your progress is saved in this browser only. Use Backup to move it to another device.
      </footer>
    </div>

    <div class="scrim" hidden></div>
    <aside class="panel" id="panel" role="dialog" aria-modal="true" hidden></aside>
    <div class="toasts" aria-live="polite"></div>

    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
