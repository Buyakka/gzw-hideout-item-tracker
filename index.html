<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0c0c" />
    <meta name="description" content="Track every item you need to build and upgrade your Gray Zone Warfare hideout. Saves your progress in your browser." />
    <title>Buyaka // GZW Hideout Item Tracker</title>
    <!-- Apply the saved text size (js/text-size.js) before the page paints -->
    <script>
      try {
        var t = localStorage.getItem('buyaka-gzw-hideout:text');
        if (t === 'lg' || t === 'xl') document.documentElement.dataset.text = t;
      } catch (e) {}
    </script>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap"
    />
  </head>
  <body>
    <!-- Background: hideout photo, plus one animated scene per room.
         The scene image is plain HTML so it still shows without JS. -->
    <div class="bg-fx" aria-hidden="true">
      <div class="scene scene--cover bg-fx__photo" data-scene="hideout">
        <img class="scene__image" src="/src/assets/hideout-bg.webp" width="1672" height="941" alt="" decoding="async" />
      </div>
      <div class="lab-background bg-fx__scene" data-scene="laboratory">
        <img class="lab-background__image" src="/src/assets/laboratory.png" width="1672" height="941" alt="" decoding="async" />
      </div>
      <div class="scene bg-fx__scene" data-scene="workshop">
        <img class="scene__image" src="/src/assets/workshop.webp" width="1759" height="894" alt="" decoding="async" />
      </div>
      <div class="scene bg-fx__scene" data-scene="utility">
        <img class="scene__image" src="/src/assets/utility.webp" width="1672" height="941" alt="" decoding="async" />
      </div>
      <div class="bg-fx__dust"></div>
      <div class="bg-fx__sweep"></div>
      <div class="bg-fx__scan"></div>
      <div class="bg-fx__vignette"></div>
    </div>

    <div class="app">
      <header class="hud">
        <a class="hud__brand" href="#home" aria-label="Buyaka hideout tracker home">
          <span class="hud__logo" data-logo="logo--idle"></span>
          <div>
            <p class="hud__title">Buyaka<span class="hud__title-rest"> <span>//</span> Hideout</span></p>
            <p class="hud__sub">Gray Zone Warfare · Update 0.5</p>
          </div>
        </a>

        <div class="hud__stats" data-stats aria-live="polite"></div>

        <div class="hud__radar" aria-hidden="true">
          <div class="radar">
            <span class="radar__blip" style="top: 22%; left: 64%; --d: 0.3s"></span>
            <span class="radar__blip" style="top: 62%; left: 30%; --d: 1.9s"></span>
            <span class="radar__blip" style="top: 70%; left: 72%; --d: 1.1s"></span>
          </div>
        </div>

        <div class="hud__actions">
          <button class="btn btn--sm text-size" type="button" data-action="text-size" aria-label="Text size">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19 9 5l5 14M5.8 14h6.4M15 19l3.5-9 3.5 9M16.2 16h4.6"/></svg>
            <span data-text-label>A</span>
          </button>
          <button class="btn btn--sm" type="button" data-action="lookup" title="Find an item (press /)" aria-label="Find an item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
            <span class="btn__text--md">Find</span>
          </button>
          <button class="btn btn--sm" data-action="export" title="Save a backup file of your progress">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg>
            <span class="btn__text--md">Backup</span>
          </button>
          <button class="btn btn--sm" data-action="import" title="Load a backup file">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21V9M7 14l5-5 5 5M4 3h16"/></svg>
            <span class="btn__text--md">Load</span>
          </button>
          <button class="btn btn--sm btn--danger" data-action="reset" title="Reset all stations" aria-label="Reset all stations">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
            <span class="btn__text--md">Reset all</span>
          </button>
          <input type="file" id="import-file" accept="application/json,.json" hidden />
        </div>
      </header>

      <nav class="room-tabs" role="tablist" aria-label="Hideout rooms"></nav>

      <main class="main" id="view"></main>

      <footer class="footer">
        <p>
          Fan made tool. Not made by or linked to MADFINGER Games. Station data checked Oct 27, 2026.
          <!-- Hidden on the landing page, which already says it -->
          <span class="footer__save">Your progress is saved in this browser only. Use Backup to move it to another device.</span>
        </p>
        <p class="footer__copy">&copy; 2026 <b>Buyaka</b>. All rights reserved.</p>
      </footer>
    </div>

    <div class="scrim" hidden></div>
    <aside class="panel" id="panel" role="dialog" aria-modal="true" hidden></aside>
    <div class="toasts" aria-live="polite"></div>
    <button class="to-top" type="button" aria-label="Back to top" title="Back to top" tabindex="-1" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>

    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
